services:
  neo4j-sample:
    image: neo4j:5.24-community
    container_name: ce-kg-neo4j-sample
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/clinicalevidence
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_sample_data:/data
volumes:
  neo4j_sample_data:
